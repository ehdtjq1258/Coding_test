<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="1부터 45까지 로또 번호 6개를 추첨해 보세요.">
<title>오늘의 행운 번호</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#778198;--line:#e8ebf2;--blue:#4169e1;--surface:#fff;--page:#f5f7fb;--soft:#fcfdff;--border:#e9edf5;--shadow:#27365712} :root[data-theme=dark]{color-scheme:dark;--ink:#edf1fb;--muted:#a4aec3;--line:#30394d;--blue:#7897ff;--surface:#20283a;--page:#111827;--soft:#252e41;--border:#30394d;--shadow:#0005}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--blue) 14%,var(--page)),var(--page) 65%)}main{width:min(100%,600px)}header{position:relative;text-align:center;margin-bottom:22px}.theme{position:absolute;right:0;top:0;padding:9px 12px;border:1px solid var(--border);border-radius:12px;color:var(--ink);background:var(--surface);font:inherit;font-size:12px;font-weight:700;cursor:pointer}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.13em;margin:0 0 12px}h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.05em;margin:0}.subtitle{color:var(--muted);margin:10px 0 0}.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px var(--shadow)}.draw{padding:clamp(24px,6vw,38px)}.label{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:22px}.label small{font-weight:400;color:var(--muted)}.balls{display:flex;justify-content:center;flex-wrap:wrap;gap:clamp(8px,2.2vw,14px);min-height:58px}.ball{width:clamp(43px,12vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:white;font-size:21px;font-weight:800;box-shadow:inset 0 -3px 6px #0002,0 5px 12px #1f2a4417;animation:pop .3s both}.placeholder{color:#b7becc;background:var(--soft);border:1px dashed var(--line)}.yellow{background:linear-gradient(145deg,#ffd65b,#f1ae18);color:#493500}.blue{background:linear-gradient(145deg,#78a8ff,#3474ec)}.red{background:linear-gradient(145deg,#ff8b7c,#ec514d)}.gray{background:linear-gradient(145deg,#aeb7c7,#778397)}.green{background:linear-gradient(145deg,#6cdab5,#27aa7e)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.8)}to{opacity:1;transform:none}}.divider{height:1px;background:var(--line)}.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px clamp(24px,6vw,38px);background:var(--soft)}.hint,.note{color:var(--muted);font-size:12px}button.draw-button{min-height:48px;padding:0 21px;border:0;border-radius:14px;color:white;background:#4169e1;font:inherit;font-weight:750;cursor:pointer;box-shadow:0 6px 14px #4169e13d}button.draw-button:hover{background:#3158d0;transform:translateY(-1px)}button:focus-visible{outline:3px solid #9db5ff;outline-offset:3px}.note{text-align:center;color:#929bad;margin-top:16px}@media(max-width:430px){.theme{position:static;margin-bottom:14px}.controls{flex-direction:column}.hint{text-align:center}button.draw-button{width:100%}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body><main><header><button class="theme" id="theme" type="button" aria-label="다크 모드로 전환">🌙 다크 모드</button><div class="eyebrow">✦ &nbsp; LOTTO NUMBER PICKER</div><h1>오늘의 행운 번호</h1><p class="subtitle">버튼을 눌러 나만의 번호를 뽑아보세요.</p></header><section class="card" aria-label="로또 번호 추첨기"><div class="draw"><div class="label"><span>추첨 결과</span><small id="count">번호 6개</small></div><div class="balls" id="balls" aria-live="polite" aria-label="아직 추첨 전입니다."></div></div><div class="divider"></div><div class="controls"><span class="hint">1부터 45까지, 중복 없이 추첨해요.</span><button class="draw-button" id="draw" type="button">↻ &nbsp; 번호 추첨하기</button></div></section><p class="note">재미를 위한 번호 추첨 도구입니다. 당첨을 보장하지 않아요.</p></main>
<script>
const balls=document.querySelector("#balls"),count=document.querySelector("#count"),colors=["yellow","blue","red","gray","green"],themeButton=document.querySelector("#theme");function setTheme(theme){document.documentElement.dataset.theme=theme;const dark=theme==="dark";themeButton.textContent=dark?"☀️ 화이트 모드":"🌙 다크 모드";themeButton.setAttribute("aria-label",dark?"화이트 모드로 전환":"다크 모드로 전환");localStorage.setItem("lotto-theme",theme)}const saved=localStorage.getItem("lotto-theme"),preferred=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";setTheme(saved||preferred);themeButton.addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));function drawNumbers(){const pool=Array.from({length:45},(_,i)=>i+1);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,6).sort((a,b)=>a-b)}function render(numbers){balls.replaceChildren();numbers.forEach((n,i)=>{const ball=document.createElement("span");ball.className=`ball ${colors[Math.floor((n-1)/10)]}`;ball.textContent=n;ball.style.animationDelay=`${i*65}ms`;balls.append(ball)});balls.setAttribute("aria-label",`추첨된 번호: ${numbers.join(", ")}`);count.textContent="추첨 완료"}document.querySelector("#draw").addEventListener("click",()=>render(drawNumbers()));for(let i=0;i<6;i++){const p=document.createElement("span");p.className="ball placeholder";p.setAttribute("aria-hidden","true");p.textContent="·";balls.append(p)}
</script></body></html>
