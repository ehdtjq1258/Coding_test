<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="1부터 45까지 로또 번호 6개를 추첨해 보세요.">
<title>오늘의 행운 번호</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#778198;--line:#e8ebf2;--blue:#4169e1;--surface:#fff;--page:#f5f7fb;--soft:#fcfdff;--border:#e9edf5;--shadow:#27365712} :root[data-theme=dark]{color-scheme:dark;--ink:#edf1fb;--muted:#a4aec3;--line:#30394d;--blue:#7897ff;--surface:#20283a;--page:#111827;--soft:#252e41;--border:#30394d;--shadow:#0005}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--blue) 14%,var(--page)),var(--page) 65%)}main{width:min(100%,600px)}header{position:relative;text-align:center;margin-bottom:22px}.theme{position:absolute;right:0;top:0;padding:9px 12px;border:1px solid var(--border);border-radius:12px;color:var(--ink);background:var(--surface);font:inherit;font-size:12px;font-weight:700;cursor:pointer}.eyebrow{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.13em;margin:0 0 12px}h1{font-size:clamp(30px,7vw,42px);letter-spacing:-.05em;margin:0}.subtitle{color:var(--muted);margin:10px 0 0}.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;overflow:hidden;box-shadow:0 20px 60px var(--shadow)}.draw{padding:clamp(24px,6vw,38px)}.label{display:flex;justify-content:space-between;font-size:14px;font-weight:750;margin-bottom:22px}.label small{font-weight:400;color:var(--muted)}.results{display:grid;gap:14px}.draw-row{display:grid;grid-template-columns:32px 1fr;align-items:center;gap:10px}.row-number{color:var(--muted);font-size:12px;font-weight:750;text-align:center}.balls{display:flex;justify-content:center;flex-wrap:nowrap;gap:clamp(5px,1.5vw,14px)}.ball{width:clamp(31px,9.5vw,58px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:white;font-size:clamp(13px,3.8vw,21px);font-weight:800;box-shadow:inset 0 -3px 6px #0002,0 5px 12px #1f2a4417;animation:pop .3s both}.placeholder{color:#b7becc;background:var(--soft);border:1px dashed var(--line)}.yellow{background:linear-gradient(145deg,#ffd65b,#f1ae18);color:#493500}.blue{background:linear-gradient(145deg,#78a8ff,#3474ec)}.red{background:linear-gradient(145deg,#ff8b7c,#ec514d)}.gray{background:linear-gradient(145deg,#aeb7c7,#778397)}.green{background:linear-gradient(145deg,#6cdab5,#27aa7e)}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.8)}to{opacity:1;transform:none}}.divider{height:1px;background:var(--line)}.controls{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px clamp(24px,6vw,38px);background:var(--soft)}.hint,.note{color:var(--muted);font-size:12px}button.draw-button{min-height:48px;padding:0 21px;border:0;border-radius:14px;color:white;background:#4169e1;font:inherit;font-weight:750;cursor:pointer;box-shadow:0 6px 14px #4169e13d}button.draw-button:hover{background:#3158d0;transform:translateY(-1px)}button:focus-visible{outline:3px solid #9db5ff;outline-offset:3px}.note{text-align:center;color:#929bad;margin-top:16px}@media(max-width:430px){.theme{position:static;margin-bottom:14px}.controls{flex-direction:column}.hint{text-align:center}button.draw-button{width:100%}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}.contact-card{margin-top:22px;padding:clamp(24px,6vw,38px)}.contact-heading{margin:0;font-size:22px;letter-spacing:-.03em}.contact-intro{margin:8px 0 22px;color:var(--muted);font-size:14px;line-height:1.6}.contact-form{display:grid;gap:16px}.field{display:grid;gap:7px}.field label{font-size:13px;font-weight:700}.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;color:var(--ink);background:var(--soft);font:inherit;font-size:14px}.field textarea{min-height:130px;resize:vertical}.field input::placeholder,.field textarea::placeholder{color:var(--muted);opacity:.75}.field input:focus,.field textarea:focus{outline:3px solid color-mix(in srgb,var(--blue) 25%,transparent);border-color:var(--blue)}.contact-submit{justify-self:start}.contact-privacy{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.form-spam{display:none}
</style>
</head>
<body><main><header><button class="theme" id="theme" type="button" aria-label="다크 모드로 전환">🌙 다크 모드</button><div class="eyebrow">✦ &nbsp; LOTTO NUMBER PICKER</div><h1>오늘의 행운 번호</h1><p class="subtitle">버튼을 눌러 나만의 번호를 뽑아보세요.</p></header><section class="card" aria-label="로또 번호 추첨기"><div class="draw"><div class="label"><span>추첨 결과</span><small id="count">5세트 · 세트당 6개</small></div><div class="results" id="results" aria-live="polite" aria-label="아직 추첨 전입니다."></div></div><div class="divider"></div><div class="controls"><span class="hint">1~45 번호로 서로 다른 5세트를 뽑아요.</span><button class="draw-button" id="draw" type="button">↻ &nbsp; 번호 추첨하기</button></div></section><section class="card contact-card" aria-labelledby="contact-title"><h2 class="contact-heading" id="contact-title">제휴 문의</h2><p class="contact-intro">제휴 제안이나 협업 문의를 남겨주세요. 확인 후 연락드리겠습니다.</p><form class="contact-form" action="https://formspree.io/f/mppwkyee" method="POST"><input type="hidden" name="_subject" value="로또 사이트 제휴 문의"><input class="form-spam" type="text" name="_gotcha" tabindex="-1" autocomplete="off"><div class="field"><label for="contact-name">이름</label><input id="contact-name" name="name" type="text" autocomplete="name" placeholder="이름을 입력해 주세요" required></div><div class="field"><label for="contact-email">이메일</label><input id="contact-email" name="email" type="email" autocomplete="email" placeholder="답변받을 이메일 주소" required></div><div class="field"><label for="contact-company">회사 또는 브랜드 <span class="count">(선택)</span></label><input id="contact-company" name="company" type="text" autocomplete="organization" placeholder="회사/브랜드명"></div><div class="field"><label for="contact-message">문의 내용</label><textarea id="contact-message" name="message" placeholder="제휴 내용과 연락 가능한 정보를 적어주세요" required></textarea></div><p class="contact-privacy">입력한 정보는 제휴 문의에 답변하기 위해 Formspree를 통해 전달됩니다.</p><button class="draw-button contact-submit" type="submit">문의 보내기</button></form></section><p class="note">
재미를 위한 번호 추첨 도구입니다. 당첨을 보장하지 않아요.</p></main>
<script>const results=document.querySelector("#results"),count=document.querySelector("#count"),colors=["yellow","blue","red","gray","green"],themeButton=document.querySelector("#theme");function setTheme(theme){document.documentElement.dataset.theme=theme;const dark=theme==="dark";themeButton.textContent=dark?"☀️ 화이트 모드":"🌙 다크 모드";themeButton.setAttribute("aria-label",dark?"화이트 모드로 전환":"다크 모드로 전환");localStorage.setItem("lotto-theme",theme)}const saved=localStorage.getItem("lotto-theme"),preferred=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";setTheme(saved||preferred);themeButton.addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark"));function drawNumbers(){const pool=Array.from({length:45},(_,i)=>i+1);for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}return pool.slice(0,6).sort((a,b)=>a-b)}function render(sets){results.replaceChildren();sets.forEach((numbers,setIndex)=>{const row=document.createElement("div");row.className="draw-row";const label=document.createElement("span");label.className="row-number";label.textContent=`${setIndex+1}회`;const balls=document.createElement("div");balls.className="balls";numbers.forEach((number,index)=>{const ball=document.createElement("span");ball.className=`ball ${colors[Math.floor((number-1)/10)]}`;ball.textContent=number;ball.style.animationDelay=`${(setIndex*6+index)*35}ms`;balls.append(ball)});row.append(label,balls);results.append(row)});results.setAttribute("aria-label",`추첨된 5세트: ${sets.map((set,index)=>`${index+1}세트 ${set.join(", ")}`).join("; ")}`);count.textContent="추첨 완료 · 5세트"}document.querySelector("#draw").addEventListener("click",()=>render(Array.from({length:5},drawNumbers)));for(let setIndex=0;setIndex<5;setIndex++){const row=document.createElement("div");row.className="draw-row";const label=document.createElement("span");label.className="row-number";label.textContent=`${setIndex+1}회`;const balls=document.createElement("div");balls.className="balls";for(let i=0;i<6;i++){const p=document.createElement("span");p.className="ball placeholder";p.setAttribute("aria-hidden","true");p.textContent="·";balls.append(p)}row.append(label,balls);results.append(row)}
</script></body></html>
